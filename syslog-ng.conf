# Reference config showing the default (no TLS, no source allowlist, no
# retention) setup. The Docker image generates its actual runtime config
# dynamically in entrypoint.sh based on env vars (TLS_CERT_FILE/TLS_KEY_FILE,
# ALLOWED_SOURCES, etc. - see README.md) instead of using this file directly.
# Use this as a starting point for a manual (non-Docker) syslog-ng install.
@version: 4.6
@include "scl.conf"

source s_net {
    udp(ip("0.0.0.0") port(514));
    tcp(ip("0.0.0.0") port(514));
};

destination d_omada {
    file("/var/log/syslogng/${HOST}/${YEAR}-${MONTH}-${DAY}.log"
        create-dirs(yes)
        template("$ISODATE $HOST $MSGHDR$MSG\n")
    );
};

log {
    source(s_net);
    destination(d_omada);
};
