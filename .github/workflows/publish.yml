name: Release and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Only auto-tag/release on a normal push to main. A manual "vX.Y.Z" tag
    # push (handled by build-and-push below) is already a release by itself.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: tag
        run: |
          if git log -1 --pretty=%B | grep -qiE '\[skip release\]|\[no release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --quiet
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$last" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes

  build-and-push:
    needs: [release]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Determine image tags
        id: imgtags
        run: |
          # docker/metadata-action derives tags from the ref that triggered
          # this *workflow run* (e.g. "push to main"), which on the
          # push-to-main path is never the version tag the release job just
          # created (tag pushes from within a job don't retrigger the
          # workflow) - so it alone would only ever produce a "main" tag.
          # Explicitly add the version + latest tags here instead.
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          tags="${{ steps.meta.outputs.tags }}"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${{ needs.release.outputs.tag }}"
          fi
          if [ -n "$version" ]; then
            tags="$(printf '%s\n%s:%s\n%s:latest' "$tags" "$image" "$version" "$image")"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
